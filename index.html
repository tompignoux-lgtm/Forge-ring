  .mono-font { font-family: 'JetBrains Mono', monospace; }

  .header-icon {

    display: flex; align-items: center; justify-content: center;
    color: #F47C4A;
  }

  .day-selector {

    scrollbar-width: none;
  }

  .day-pill {

    padding: 10px 8px;
    background: transparent;
    border: 1px solid #2A2520;
    color: #EDE6DC;
    cursor: pointer;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.05em;

    position: relative;

  .day-pill.active { color: #0F0D0B; }
  .day-pill.rest { color: #6B6258; }
  .day-pill.today { border-color: #F47C4A; }
  .day-pill .j-label { font-size: 10px; opacity: 0.7; }
  .day-pill .day-short { font-size: 15px; margin-top: 2px; }
  .today-dot {
    width: 4px; height: 4px;

    color: #EDE6DC;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s ease;

  .variant-chip:active { transform: scale(0.95); }
  .variant-chip.active { color: #0F0D0B; }
  .session-desc { font-size: 12px; color: #A39989; line-height: 1.5; margin-top: 12px; }

  .session-header {
    padding: 20px 0 16px;
    border-bottom: 1px solid #1E1A16;
  }
  .session-top { display: flex; align-items: flex-start; gap: 14px; }
  .session-icon {
    width: 44px; height: 44px;
    color: #0F0D0B;
    display: flex; align-items: center; justify-content: center;

  .session-meta { font-size: 11px; letter-spacing: 0.1em; }
  .session-title { font-size: 26px; margin-top: 2px; line-height: 1.05; }

  .progress-wrap { margin-top: 16px; }
  .progress-labels {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .progress-label { font-size: 10px; color: #6B6258; letter-spacing: 0.1em; }
  .progress-count { font-size: 11px; }
  .progress-track { height: 2px; background: #1E1A16; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

  .block { margin-top: 28px; }

  .block-num { font-size: 14px; color: #6B6258; letter-spacing: 0.15em; }
  .block-line { flex: 1; height: 1px; background: #1E1A16; }
  .block-duration { font-size: 10px; color: #6B6258; letter-spacing: 0.1em; }
  .block-name { font-size: 22px; margin-bottom: 12px; letter-spacing: 0.02em; }

  .exo-row {

    border-bottom: 1px solid #1E1A16;
    display: flex; gap: 14px;
    align-items: flex-start;
    transition: background 0.2s ease;

  .checkbox {
    width: 22px; height: 22px;
    flex-shrink: 0;
    margin-top: 2px;
    border: 1.5px solid #3A332D;
    background: transparent;

  .checkbox.done svg { display: block; }

  .exo-name { font-size: 15px; font-weight: 500; color: #EDE6DC; line-height: 1.3; }

  .exo-scheme.done { opacity: 0.5; }
  .exo-note { font-size: 11px; color: #8B8680; margin-top: 3px; font-style: italic; }

  .load-wrap {

  .load-label { font-size: 10px; color: #6B6258; letter-spacing: 0.1em; font-family: 'JetBrains Mono', monospace; }
  .load-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed #3A332D;
    color: #EDE6DC;
    font-family: 'JetBrains Mono', monospace;

  .load-input:focus { border-bottom-color: #F47C4A; }
  .load-input::placeholder { color: #5A5248; }
  .load-unit { font-size: 10px; color: #5A5248; font-family: 'JetBrains Mono', monospace; }

    margin-top: 40px;
    display: flex; gap: 10px;
  }
  .nav-btn {
    flex: 1;
    padding: 14px;
    border: 1px solid #2A2520;
    color: #EDE6DC;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 0.1em;

  .footer-note {

    padding: 16px;
    background: #16120E;
    border: 1px solid #1E1A16;

  .footer-title { font-size: 10px; color: #F47C4A; letter-spacing: 0.15em; margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
  .footer-text { font-size: 12px; color: #A39989; line-height: 1.5; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: slideUp 0.3s ease forwards; }
</style>
</head>

        desc: "Format course : 1 km de course puis une station, 4 fois. Pas de SkiErg ou de traîneau ? Remplace par rameur et poussée de disques au sol.",
        blocks: [
          { name: "4 × (1 km + station)", duration: "40-50 min", exercises: [
            { id: "r1", name: "1 km course → SkiErg", scheme: "1 000 m", tracked: false },
            { id: "r2", name: "1 km course → Sled push", scheme: "50 m", tracked: false },
            { id: "r3", name: "1 km course → Rameur", scheme: "1 000 m", tracked: false },
            { id: "r4", name: "1 km course → Wall balls", scheme: "50 reps", tracked: true, label: "BALLON", unit: "kg" },
            { id: "chrono", name: "Chrono total", scheme: "objectif : le battre", tracked: true, label: "CHRONO", unit: "min" },
          ]},

      {

        title: "Hyrox — Stations en rounds", duration: "40-45 min",
        desc: "Travail des stations les plus dures sur jambes fatiguées (« compromised running »).",
        blocks: [
          { name: "4 tours", duration: "35-40 min", exercises: [
            { id: "run", name: "Course", scheme: "400 m", tracked: false },
            { id: "wb", name: "Wall balls", scheme: "20 reps", tracked: true, label: "BALLON", unit: "kg" },
            { id: "lunges", name: "Fentes marchées sandbag", scheme: "20 m", tracked: true, label: "SAC", unit: "kg" },
            { id: "bbj", name: "Burpees sautés en longueur", scheme: "10 reps", tracked: false },
            { id: "farmer", name: "Farmer carry", scheme: "100 m", note: "Récup 2 min entre les tours", tracked: true, label: "HALTÈRES", unit: "kg" },
          ]},
        ],
      },
    ],
  },
  {
    id: "rest_dim", day: "DIM", short: "REPOS", dayFull: "Dimanche — Repos",
    title: "Repos & récupération", duration: "libre",
    icon: "rest", accent: "#8B8680", rest: true,
    blocks: [
      { name: "Récupération", duration: "libre", exercises: [
        { id: "mob", name: "Mobilité / étirements", scheme: "15-20 min", tracked: false },
        { id: "sleep", name: "Sommeil prioritaire", scheme: "8 h visées", tracked: false },
        { id: "prep", name: "Préparer la semaine (repas, sac)", scheme: "—", tracked: false },
      ]},
    ],
  },
];

const ICONS = {
  push: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>',
  pull: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>',
  legs: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
  run: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
  fire: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
  rest: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',
};
const CHECK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F0D0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const CHEVRON_L = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
const CHEVRON_R = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

const weekKey = () => {
  const d = new Date();
  const onejan = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - onejan) / 86400000 + onejan.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${week}`;
};

function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { return {}; }
}
function writeJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

// Lundi = 0 … Dimanche = 6
const TODAY = (new Date().getDay() + 6) % 7;

const state = {
  active: TODAY,
  checked: readJSON(`checked:${weekKey()}`),
  loads: readJSON("loads"),
  variants: readJSON(`variants:${weekKey()}`),
};

function saveChecked() { writeJSON(`checked:${weekKey()}`, state.checked); }
function saveLoads() { writeJSON("loads", state.loads); }
function saveVariants() { writeJSON(`variants:${weekKey()}`, state.variants); }

// Séance affichée (avec la variante choisie si la journée en propose)
function currentView(session) {
  if (!session.variants) return { view: session, prefix: session.id, variant: null };
  const variant = session.variants.find(v => v.id === state.variants[session.id]) || null;
  if (!variant) return { view: session, prefix: session.id, variant: null };
  return { view: { ...session, ...variant, id: session.id }, prefix: `${session.id}:${variant.id}`, variant };
}

function renderDaySelector() {
  const ds = document.getElementById("daySelector");
  ds.innerHTML = "";
  SESSIONS.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "day-pill";
    if (i === state.active) { btn.classList.add("active"); btn.style.background = s.accent; btn.style.borderColor = s.accent; }
    if (s.rest) btn.classList.add("rest");
    if (i === TODAY && i !== state.active) btn.classList.add("today");
    btn.innerHTML = `
      <div class="j-label">${s.day}</div>
      <div class="day-short">${s.short}</div>
      ${i === TODAY ? '<div class="today-dot"' + (i === state.active ? ' style="background:#0F0D0B"' : '') + '></div>' : ''}
    `;
    btn.onclick = () => { state.active = i; render(); window.scrollTo({top: 0, behavior: "smooth"}); };
    ds.appendChild(btn);
  });
  const activeBtn = ds.children[state.active];
  if (activeBtn && activeBtn.scrollIntoView) activeBtn.scrollIntoView({ inline: "center", block: "nearest" });
}

function renderVariantPicker(session, variant) {
  const groups = [];
  session.variants.forEach(v => {
    let g = groups.find(x => x.name === v.group);
    if (!g) { g = { name: v.group, items: [] }; groups.push(g); }
    g.items.push(v);
  });
  let html = `<div class="variant-wrap"><div class="variant-title mono-font">${session.pickLabel}</div>`;
  groups.forEach(g => {
    html += `<div class="variant-group mono-font">${g.name.toUpperCase()}</div><div class="variant-row">`;
    g.items.forEach(v => {
      const on = variant && variant.id === v.id;
      html += `<button class="variant-chip ${on ? 'active' : ''}" data-variant="${v.id}" style="${on ? `background:${session.accent}; border-color:${session.accent}` : ''}">${v.label}</button>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function render() {
  renderDaySelector();
  const session = SESSIONS[state.active];
  const { view, prefix, variant } = currentView(session);
  const content = document.getElementById("content");
  const blocks = view.blocks || [];
  const allExos = blocks.flatMap(b => b.exercises);
  const doneCount = allExos.filter(e => state.checked[`${prefix}:${e.id}`]).length;
  const progress = allExos.length ? (doneCount / allExos.length) * 100 : 0;

  const title = view.title || (session.variants ? "À choisir" : "");
  const meta = view.duration ? `${session.dayFull.toUpperCase()} · ${view.duration}` : session.dayFull.toUpperCase();

  let html = `
    <div class="fade-in" style="animation: slideUp 0.3s ease">
      <div class="session-header">
        <div class="session-top">
          <div class="session-icon" style="background:${session.accent}">${ICONS[session.icon]}</div>
          <div style="flex:1; min-width:0">
            <div class="session-meta mono-font" style="color:${session.accent}">${meta}</div>
            <h2 class="session-title display-font">${title}</h2>
          </div>
        </div>
        ${view.desc ? `<div class="session-desc">${view.desc}</div>` : ''}
        ${!session.rest && allExos.length ? `
          <div class="progress-wrap">
            <div class="progress-labels">
              <span class="progress-label mono-font">PROGRESSION</span>
              <span class="progress-count mono-font" style="color:${session.accent}">${doneCount}/${allExos.length}</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${progress}%; background:${session.accent}"></div>
            </div>
          </div>
        ` : ''}
      </div>
  `;

  if (session.variants) html += renderVariantPicker(session, variant);

  blocks.forEach((block, bi) => {
    html += `
      <div class="block">
        <div class="block-header">
          <div class="block-num display-font">${String(bi+1).padStart(2,'0')}</div>
          <div class="block-line"></div>
          <div class="block-duration mono-font">${block.duration.toUpperCase()}</div>
        </div>
        <h3 class="block-name display-font">${block.name}</h3>
    `;
    block.exercises.forEach(exo => {
      const k = `${prefix}:${exo.id}`;
      const isDone = !!state.checked[k];
      html += `
        <div class="exo-row">
          <button class="checkbox ${isDone ? 'done' : ''}" data-exo="${exo.id}" style="border-color:${isDone ? session.accent : '#3A332D'}; background:${isDone ? session.accent : 'transparent'}">
            ${CHECK_ICON}
          </button>
          <div class="exo-body">
            <div class="exo-name ${isDone ? 'done' : ''}">${exo.name}</div>
            <div class="exo-scheme ${isDone ? 'done' : ''}" style="color:${session.accent}">${exo.scheme}</div>
            ${exo.note ? `<div class="exo-note">${exo.note}</div>` : ''}
            ${exo.tracked && !session.rest ? `
              <div class="load-wrap">
                <span class="load-label">${exo.label || 'CHARGE'}</span>
                <input type="text" inputmode="decimal" class="load-input" data-load="${exo.id}" placeholder="—" value="${state.loads[k] || ''}">
                <span class="load-unit">${exo.unit || 'kg'}</span>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    });
    html += `</div>`;
  });

  html += `
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn">${CHEVRON_L} PRÉC</button>
        <button class="nav-btn primary" id="nextBtn" style="background:${session.accent}; border-color:${session.accent}">SUIV ${CHEVRON_R}</button>
      </div>
      <div class="footer-note">
        <div class="footer-title">RAPPEL</div>
        <div class="footer-text">L'appli s'ouvre sur le jour en cours. Vendredi et samedi, choisis ta séance du jour en haut de la page. Les charges et chronos sont sauvegardés sur ton téléphone ; les cases et les choix de séance se réinitialisent chaque semaine.</div>
      </div>
    </div>
  `;

  content.innerHTML = html;

  content.querySelectorAll('.variant-chip').forEach(btn => {
    btn.onclick = () => {
      state.variants[session.id] = btn.dataset.variant;
      saveVariants();
      render();
    };
  });

  content.querySelectorAll('.checkbox').forEach(cb => {
    cb.onclick = () => {
      const k = `${prefix}:${cb.dataset.exo}`;
      state.checked[k] = !state.checked[k];
      saveChecked();
      render();
    };
  });

  content.querySelectorAll('.load-input').forEach(inp => {
    inp.oninput = () => {
      state.loads[`${prefix}:${inp.dataset.load}`] = inp.value;
      saveLoads();
    };
  });

  const n = SESSIONS.length;
  document.getElementById('prevBtn').onclick = () => { state.active = (state.active - 1 + n) % n; render(); window.scrollTo({top:0, behavior:"smooth"}); };
  document.getElementById('nextBtn').onclick = () => { state.active = (state.active + 1) % n; render(); window.scrollTo({top:0, behavior:"smooth"}); };
}

render();
</script>
</body>
</html>
