<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge / Ring">
<meta name="theme-color" content="#0F0D0B">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Forge / Ring — Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { overscroll-behavior: none; }
  body {
    background: #0F0D0B;
    color: #EDE6DC;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
    min-height: 100vh;
  }
  .display-font { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
  .mono-font { font-family: 'JetBrains Mono', monospace; }

  .grain::before {
    content: ""; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.25'/></svg>");
    opacity: 0.4; pointer-events: none; z-index: 100; mix-blend-mode: overlay;
  }

  header {
    padding: 28px 20px 16px;
    border-bottom: 1px solid #1E1A16;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-label { font-size: 10px; color: #6B6258; letter-spacing: 0.15em; text-transform: uppercase; }
  h1 { font-size: 38px; margin-top: 4px; line-height: 0.95; }
  .header-icon {
    width: 44px; height: 44px;
    border: 1px solid #2A2520;
    display: flex; align-items: center; justify-content: center;
    color: #F47C4A;
  }

  .day-selector {
    padding: 16px 12px;
    display: flex; gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .day-selector::-webkit-scrollbar { display: none; }
  .day-pill {
    flex-shrink: 0;
    min-width: 64px;
    padding: 10px 8px;
    background: transparent;
    border: 1px solid #2A2520;
    color: #EDE6DC;
    cursor: pointer;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.05em;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .day-pill:active { transform: scale(0.95); }
  .day-pill.active { color: #0F0D0B; }
  .day-pill.rest { color: #6B6258; }
  .day-pill.today { border-color: #F47C4A; }
  .day-pill .j-label { font-size: 10px; opacity: 0.7; }
  .day-pill .day-short { font-size: 15px; margin-top: 2px; }
  .today-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #F47C4A;
    margin: 3px auto 0;
  }

  .content { padding: 0 20px; }

  .variant-wrap { padding: 18px 0 4px; border-bottom: 1px solid #1E1A16; }
  .variant-title { font-size: 10px; color: #6B6258; letter-spacing: 0.15em; margin-bottom: 10px; }
  .variant-group { font-size: 10px; color: #8B8680; letter-spacing: 0.12em; margin: 10px 0 6px; }
  .variant-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .variant-chip {
    padding: 8px 12px;
    background: transparent;
    border: 1px solid #2A2520;
    color: #EDE6DC;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .variant-chip:active { transform: scale(0.95); }
  .variant-chip.active { color: #0F0D0B; }
  .session-desc { font-size: 12px; color: #A39989; line-height: 1.5; margin-top: 12px; }

  .session-header {
    padding: 20px 0 16px;
    border-bottom: 1px solid #1E1A16;
  }
  .session-top { display: flex; align-items: flex-start; gap: 14px; }
  .session-icon {
    width: 44px; height: 44px;
    color: #0F0D0B;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .session-meta { font-size: 11px; letter-spacing: 0.1em; }
  .session-title { font-size: 26px; margin-top: 2px; line-height: 1.05; }

  .progress-wrap { margin-top: 16px; }
  .progress-labels {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .progress-label { font-size: 10px; color: #6B6258; letter-spacing: 0.1em; }
  .progress-count { font-size: 11px; }
  .progress-track { height: 2px; background: #1E1A16; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

  .block { margin-top: 28px; }
  .block-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .block-num { font-size: 14px; color: #6B6258; letter-spacing: 0.15em; }
  .block-line { flex: 1; height: 1px; background: #1E1A16; }
  .block-duration { font-size: 10px; color: #6B6258; letter-spacing: 0.1em; }
  .block-name { font-size: 22px; margin-bottom: 12px; letter-spacing: 0.02em; }

  .exo-row {
    padding: 14px 0;
    border-bottom: 1px solid #1E1A16;
    display: flex; gap: 14px;
    align-items: flex-start;
    transition: background 0.2s ease;
  }
  .exo-row:active { background: rgba(244, 124, 74, 0.08); }

  .checkbox {
    width: 22px; height: 22px;
    flex-shrink: 0;
    margin-top: 2px;
    border: 1.5px solid #3A332D;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .checkbox.done { }
  .checkbox svg { display: none; }
  .checkbox.done svg { display: block; }

  .exo-body { flex: 1; min-width: 0; }
  .exo-name { font-size: 15px; font-weight: 500; color: #EDE6DC; line-height: 1.3; }
  .exo-name.done { color: #6B6258; text-decoration: line-through; }
  .exo-scheme { font-size: 12px; margin-top: 3px; font-family: 'JetBrains Mono', monospace; }
  .exo-scheme.done { opacity: 0.5; }
  .exo-note { font-size: 11px; color: #8B8680; margin-top: 3px; font-style: italic; }

  .load-wrap {
    margin-top: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .load-label { font-size: 10px; color: #6B6258; letter-spacing: 0.1em; font-family: 'JetBrains Mono', monospace; }
  .load-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed #3A332D;
    color: #EDE6DC;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    width: 56px;
    padding: 2px 4px;
    outline: none;
    transition: border-color 0.2s;
  }
  .load-input:focus { border-bottom-color: #F47C4A; }
  .load-input::placeholder { color: #5A5248; }
  .load-unit { font-size: 10px; color: #5A5248; font-family: 'JetBrains Mono', monospace; }

  .nav-row {
    margin-top: 40px;
    display: flex; gap: 10px;
  }
  .nav-btn {
    flex: 1;
    padding: 14px;
    border: 1px solid #2A2520;
    color: #EDE6DC;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 0.1em;
  }
  .nav-btn.primary { color: #0F0D0B; font-weight: 600; }

  .footer-note {
    margin-top: 32px;
    padding: 16px;
    background: #16120E;
    border: 1px solid #1E1A16;
  }
  .footer-title { font-size: 10px; color: #F47C4A; letter-spacing: 0.15em; margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
  .footer-text { font-size: 12px; color: #A39989; line-height: 1.5; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: slideUp 0.3s ease forwards; }

  .sets { margin-top: 10px; }
  .last-line { font-size: 10px; color: #6B6258; font-family: 'JetBrains Mono', monospace; margin: 6px 0 8px; letter-spacing: 0.02em; }
  .last-line b { color: #A39989; font-weight: 500; }
  .set-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; margin-bottom: 4px;
    border: 1px solid #1E1A16; background: #13100D;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .set-row.done { background: transparent; border-color: transparent; opacity: 0.6; }
  .set-row.next { border-color: #3A332D; }
  .set-num { font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: #6B6258; width: 26px; letter-spacing: 0.05em; }
  .set-input {
    width: 58px; padding: 8px 4px; text-align: center;
    background: #0F0D0B; border: 1px solid #2A2520; color: #EDE6DC;
    font-family: 'JetBrains Mono', monospace; font-size: 16px; outline: none;
    -webkit-appearance: none; border-radius: 0;
  }
  .set-input:focus { border-color: #F47C4A; }
  .set-input::placeholder { color: #5A5248; }
  .set-row.done .set-input { border-color: transparent; background: transparent; }
  .set-unit { font-size: 10px; color: #6B6258; font-family: 'JetBrains Mono', monospace; }
  .set-x { font-size: 12px; color: #5A5248; }
  .set-pdc { width: 58px; text-align: center; font-size: 11px; color: #6B6258; font-family: 'JetBrains Mono', monospace; }
  .set-ok {
    margin-left: auto; width: 40px; height: 36px; flex-shrink: 0;
    border: 1.5px solid #3A332D; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .set-ok svg { stroke: #6B6258; }
  .set-ok.done svg { stroke: #0F0D0B; }
  .set-tools { display: flex; gap: 14px; margin-top: 6px; }
  .set-tool { background: none; border: none; color: #6B6258; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; cursor: pointer; padding: 4px 0; }

  .timer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    background: #16120E; border-top: 1px solid #2A2520;
    display: none; align-items: center; gap: 10px;
  }
  .timer.on { display: flex; }
  .timer-label { font-size: 10px; color: #6B6258; letter-spacing: 0.15em; font-family: 'JetBrains Mono', monospace; }
  .timer-time { font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1; color: #F47C4A; min-width: 72px; }
  .timer-time.over { color: #EDE6DC; }
  .timer-btn { border: 1px solid #2A2520; background: transparent; color: #EDE6DC; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 10px; cursor: pointer; }
  .timer-btn.skip { margin-left: auto; }
  .timer-bar { position: absolute; top: -1px; left: 0; height: 2px; background: #F47C4A; }
  body.timing { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div class="grain"></div>

<header>
  <div>
    <div class="header-label mono-font">Programme · 3 muscu · course · cartouche</div>
    <h1 class="display-font">FORGE <span style="color:#F47C4A">/</span> RING</h1>
  </div>
  <div class="header-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="18"/><line x1="7" y1="17" x2="4" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/></svg>
  </div>
</header>

<div class="day-selector" id="daySelector"></div>

<div class="content" id="content"></div>

<div class="timer" id="timer">
  <div class="timer-bar" id="timerBar"></div>
  <div>
    <div class="timer-label" id="timerLabel">RÉCUP</div>
    <div class="timer-time" id="timerTime">0:00</div>
  </div>
  <button class="timer-btn" id="timerMinus">−15</button>
  <button class="timer-btn" id="timerPlus">+15</button>
  <button class="timer-btn skip" id="timerSkip">PASSER</button>
</div>

      {

const weekKey = () => {
  const d = new Date();
  const onejan = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - onejan) / 86400000 + onejan.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${week}`;
};

function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { return {}; }
}
function writeJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

// Lundi = 0 … Dimanche = 6
const TODAY = (new Date().getDay() + 6) % 7;

const state = {
  active: TODAY,
  checked: readJSON(`checked:${weekKey()}`),
  loads: readJSON("loads"),
  variants: readJSON(`variants:${weekKey()}`),
  sets: readJSON(`sets:${weekKey()}`),
  history: readJSON("history"),
};

function saveChecked() { writeJSON(`checked:${weekKey()}`, state.checked); }
function saveLoads() { writeJSON("loads", state.loads); }
function saveVariants() { writeJSON(`variants:${weekKey()}`, state.variants); }
function saveSets() { writeJSON(`sets:${weekKey()}`, state.sets); }
function saveHistory() { writeJSON("history", state.history); }

// ---------- Séries ----------
// "4 × 15-20" → { n: 4, reps: "15", unit: "reps" } ; "3 × 45 s" → unit "s" ; "3 × max" → reps "max"
function parseScheme(scheme) {
  const m = /^(\d+)\s*×\s*(.+)$/.exec(scheme || "");
  if (!m) return null;
  const rest = m[2];
  const num = /(\d+)/.exec(rest);
  const isSec = /^\s*\d+\s*s\b/.test(rest);
  return { n: parseInt(m[1], 10), reps: /max/.test(rest) ? "max" : (num ? num[1] : ""), unit: isSec ? "s" : "reps" };
}

function usesSets(session, exo) {
  return !session.rest && !session.variants && !!parseScheme(exo.scheme);
}

// Temps de récup : "Récup 3 min" dans la note, sinon 3 min pour le lourd (≤ 6 reps), 90 s sinon
function restFor(exo) {
  const m = /Récup\s+(\d+)\s*min/i.exec(exo.note || "");
  if (m) return parseInt(m[1], 10) * 60;
  const p = parseScheme(exo.scheme);
  if (p && p.reps !== "max" && p.unit === "reps" && parseInt(p.reps, 10) <= 6) return 180;
  return 90;
}

function getSets(k, exo) {
  const p = parseScheme(exo.scheme);
  let arr = state.sets[k];
  if (!arr) arr = [];
  while (arr.length < p.n) arr.push({ kg: "", reps: "", done: false });
  state.sets[k] = arr;
  return arr;
}

// Dernière séance d'une semaine précédente
function lastTime(k) {
  const h = state.history[k];
  if (!h) return null;
  const weeks = Object.keys(h).filter(w => w !== weekKey()).sort((a, b) => {
    const [ya, wa] = a.split("-W").map(Number), [yb, wb] = b.split("-W").map(Number);
    return yb - ya || wb - wa;
  });
  return weeks.length ? h[weeks[0]] : null;
}

function recordHistory(k) {
  const done = (state.sets[k] || []).filter(s => s.done).map(s => ({ kg: s.kg, reps: s.reps }));
  state.history[k] = state.history[k] || {};
  if (done.length) state.history[k][weekKey()] = done; else delete state.history[k][weekKey()];
  // on garde les 12 dernières semaines
  const ws = Object.keys(state.history[k]).sort();
  while (ws.length > 12) delete state.history[k][ws.shift()];
  saveHistory();
}

function fmtSets(list, withKg) {
  return list.map(s => withKg && s.kg ? `${s.kg}×${s.reps}` : `${s.reps}`).join(" · ");
}

// Valeurs proposées par défaut (placeholder) pour une série
function suggest(k, exo, i, arr) {
  const p = parseScheme(exo.scheme);
  const last = lastTime(k);
  let prev = null;
  for (let j = i - 1; j >= 0; j--) if (arr[j].kg) { prev = arr[j]; break; }
  const kg = (prev && prev.kg) || (last && last[i] && last[i].kg) || (last && last.length && last[last.length - 1].kg) || state.loads[k] || "";
  const reps = (last && last[i] && last[i].reps) || (p.reps === "max" ? "" : p.reps);
  return { kg, reps };
}

// ---------- Minuteur de récup ----------
const timer = { end: 0, total: 0, id: null };
function startTimer(sec, label) {
  timer.total = sec; timer.end = Date.now() + sec * 1000;
  document.getElementById("timerLabel").textContent = label || "RÉCUP";
  document.getElementById("timer").classList.add("on");
  document.body.classList.add("timing");
  clearInterval(timer.id);
  timer.id = setInterval(tickTimer, 250);
  tickTimer();
}
function stopTimer() {
  clearInterval(timer.id); timer.id = null;
  document.getElementById("timer").classList.remove("on");
  document.body.classList.remove("timing");
}
function tickTimer() {
  const left = Math.round((timer.end - Date.now()) / 1000);
  const el = document.getElementById("timerTime");
  const a = Math.abs(left);
  el.textContent = `${left < 0 ? "+" : ""}${Math.floor(a / 60)}:${String(a % 60).padStart(2, "0")}`;
  el.classList.toggle("over", left < 0);
  document.getElementById("timerBar").style.width = `${Math.max(0, Math.min(100, (left / timer.total) * 100))}%`;
  if (left === 0) { try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
  if (left < -300) stopTimer();
}
document.getElementById("timerSkip").onclick = stopTimer;
document.getElementById("timerPlus").onclick = () => { timer.end += 15000; timer.total += 15; tickTimer(); };
document.getElementById("timerMinus").onclick = () => { timer.end -= 15000; tickTimer(); };

const SET_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function renderSets(session, exo, k) {
  const arr = getSets(k, exo);
  const p = parseScheme(exo.scheme);
  const withKg = !!exo.tracked;
  const last = lastTime(k);
  const nextIdx = arr.findIndex(s => !s.done);
  let html = `<div class="sets">`;
  if (last && last.length) html += `<div class="last-line">DERNIÈRE FOIS : <b>${fmtSets(last, withKg)}</b></div>`;
  arr.forEach((s, i) => {
    const sg = suggest(k, exo, i, arr);
    const isNext = i === nextIdx;
    html += `
      <div class="set-row ${s.done ? 'done' : ''} ${isNext ? 'next' : ''}">
        <span class="set-num">S${i + 1}</span>
        ${withKg ? `
          <input class="set-input" type="text" inputmode="decimal" data-set="${i}" data-f="kg" data-exo="${exo.id}" value="${s.kg}" placeholder="${sg.kg || 'kg'}">
          <span class="set-unit">kg</span><span class="set-x">×</span>
        ` : `<span class="set-pdc">PDC</span><span class="set-x">×</span>`}
        <input class="set-input" type="text" inputmode="numeric" data-set="${i}" data-f="reps" data-exo="${exo.id}" value="${s.reps}" placeholder="${sg.reps || p.reps || '—'}">
        <span class="set-unit">${p.unit}</span>
        <button class="set-ok ${s.done ? 'done' : ''}" data-set="${i}" data-exo="${exo.id}" style="${s.done ? `background:${session.accent}; border-color:${session.accent}` : (isNext ? `border-color:${session.accent}` : '')}">${SET_CHECK}</button>
      </div>`;
  });
  html += `<div class="set-tools">
      <button class="set-tool" data-add="${exo.id}">+ SÉRIE</button>
      ${arr.length > p.n ? `<button class="set-tool" data-del="${exo.id}">− SÉRIE</button>` : ''}
    </div></div>`;
  return html;
}

// Séance affichée (avec la variante choisie si la journée en propose)
function currentView(session) {
  if (!session.variants) return { view: session, prefix: session.id, variant: null };
  const variant = session.variants.find(v => v.id === state.variants[session.id]) || null;
  if (!variant) return { view: session, prefix: session.id, variant: null };
  return { view: { ...session, ...variant, id: session.id }, prefix: `${session.id}:${variant.id}`, variant };
}

function renderDaySelector() {
  const ds = document.getElementById("daySelector");
  ds.innerHTML = "";
  SESSIONS.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "day-pill";
    if (i === state.active) { btn.classList.add("active"); btn.style.background = s.accent; btn.style.borderColor = s.accent; }
    if (s.rest) btn.classList.add("rest");
    if (i === TODAY && i !== state.active) btn.classList.add("today");
    btn.innerHTML = `
      <div class="j-label">${s.day}</div>
      <div class="day-short">${s.short}</div>
      ${i === TODAY ? '<div class="today-dot"' + (i === state.active ? ' style="background:#0F0D0B"' : '') + '></div>' : ''}
    `;
    btn.onclick = () => { state.active = i; render(); window.scrollTo({top: 0, behavior: "smooth"}); };
    ds.appendChild(btn);
  });
  const activeBtn = ds.children[state.active];
  if (activeBtn) ds.scrollLeft = activeBtn.offsetLeft - (ds.clientWidth - activeBtn.offsetWidth) / 2;
}

function renderVariantPicker(session, variant) {
  const groups = [];
  session.variants.forEach(v => {
    let g = groups.find(x => x.name === v.group);
    if (!g) { g = { name: v.group, items: [] }; groups.push(g); }
    g.items.push(v);
  });
  let html = `<div class="variant-wrap"><div class="variant-title mono-font">${session.pickLabel}</div>`;
  groups.forEach(g => {
    html += `<div class="variant-group mono-font">${g.name.toUpperCase()}</div><div class="variant-row">`;
    g.items.forEach(v => {
      const on = variant && variant.id === v.id;
      html += `<button class="variant-chip ${on ? 'active' : ''}" data-variant="${v.id}" style="${on ? `background:${session.accent}; border-color:${session.accent}` : ''}">${v.label}</button>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function render() {
  renderDaySelector();
  const session = SESSIONS[state.active];
  const { view, prefix, variant } = currentView(session);
  const content = document.getElementById("content");
  const blocks = view.blocks || [];
  const allExos = blocks.flatMap(b => b.exercises);
  const doneCount = allExos.filter(e => state.checked[`${prefix}:${e.id}`]).length;
  const progress = allExos.length ? (doneCount / allExos.length) * 100 : 0;

  const title = view.title || (session.variants ? "À choisir" : "");

          <div class="block-num display-font">${String(bi+1).padStart(2,'0')}</div>

                <span class="load-unit">${exo.unit || 'kg'}</span>
              </div>

          </div>

      `;

  html += `

      <div class="footer-note">
        <div class="footer-title">RAPPEL</div>
        <div class="footer-text">L'appli s'ouvre sur le jour en cours. Vendredi et samedi, choisis ta séance du jour en haut de la page. En muscu, valide chaque série avec ✓ : si tu ne tapes rien, la charge et les reps proposées en gris sont enregistrées, et le chrono de récup démarre. « Dernière fois » te montre ta séance de la semaine précédente. Tout est sauvegardé sur ton téléphone ; les cases se réinitialisent chaque semaine.</div>
      </div>
    </div>
  `;

  content.innerHTML = html;

  content.querySelectorAll('.variant-chip').forEach(btn => {
    btn.onclick = () => {
      state.variants[session.id] = btn.dataset.variant;
      saveVariants();
      render();
    };
  });

  content.querySelectorAll('.checkbox').forEach(cb => {
    cb.onclick = () => {
      const k = `${prefix}:${cb.dataset.exo}`;
      state.checked[k] = !state.checked[k];
      saveChecked();
      render();
    };
  });

  content.querySelectorAll('.load-input').forEach(inp => {
    inp.oninput = () => {
      state.loads[`${prefix}:${inp.dataset.load}`] = inp.value;
      saveLoads();
    };
  });

  // Séries : saisie
  content.querySelectorAll('.set-input').forEach(inp => {
    inp.oninput = () => {
      const k = `${prefix}:${inp.dataset.exo}`;
      const s = state.sets[k][+inp.dataset.set];
      s[inp.dataset.f] = inp.value.replace(",", ".");
      saveSets();
      if (s.done) recordHistory(k);
    };
  });

  // Séries : valider / annuler
  content.querySelectorAll('.set-ok').forEach(btn => {
    btn.onclick = () => {
      const exo = allExos.find(e => e.id === btn.dataset.exo);
      const k = `${prefix}:${exo.id}`;
      const arr = state.sets[k];
      const i = +btn.dataset.set;
      const s = arr[i];
      if (!s.done) {
        const sg = suggest(k, exo, i, arr);
        if (exo.tracked && !s.kg) s.kg = sg.kg;
        if (!s.reps) s.reps = sg.reps;
        if (!s.reps) {  // ex. "max" : il faut taper le nombre fait
          const inp = content.querySelector(`input[data-exo="${exo.id}"][data-set="${i}"][data-f="reps"]`);
          if (inp) inp.focus();
          return;
        }
        s.done = true;
        if (exo.tracked && s.kg) { state.loads[k] = s.kg; saveLoads(); }
        const allDone = arr.every(x => x.done);
        if (allDone) { state.checked[k] = true; saveChecked(); }
        startTimer(restFor(exo), allDone ? "RÉCUP · EXO SUIVANT" : `RÉCUP · AVANT S${i + 2}`);
      } else {
        s.done = false;
        state.checked[k] = false; saveChecked();
      }
      saveSets(); recordHistory(k);
      render();
    };
  });

  content.querySelectorAll('[data-add]').forEach(btn => {
    btn.onclick = () => {
      const k = `${prefix}:${btn.dataset.add}`;
      state.sets[k].push({ kg: "", reps: "", done: false });
      state.checked[k] = false; saveChecked(); saveSets(); render();
    };
  });
  content.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      const k = `${prefix}:${btn.dataset.del}`;
      state.sets[k].pop();
      if (state.sets[k].every(x => x.done)) { state.checked[k] = true; saveChecked(); }
      saveSets(); recordHistory(k); render();
    };
  });

  const n = SESSIONS.length;
  document.getElementById('prevBtn').onclick = () => { state.active = (state.active - 1 + n) % n; render(); window.scrollTo({top:0, behavior:"smooth"}); };
  document.getElementById('nextBtn').onclick = () => { state.active = (state.active + 1) % n; render(); window.scrollTo({top:0, behavior:"smooth"}); };
}

render();
</script>
</body>
</html>
